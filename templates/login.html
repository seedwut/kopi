<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เข้าสู่ระบบ Admin - CoffeeStream</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #2c2f33; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .login-box { background: #3b3e45; padding: 40px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #d4a373; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: none; box-sizing: border-box; }
        button { width: 100%; background-color: #d4a373; color: #2c2f33; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background-color: #b78a5d; }
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: left; }
        .alert-error { background-color: #f8d7da; color: #721c24; }
        .alert-success { background-color: #d4edda; color: #155724; }
        a { color: #aaa; text-decoration: none; font-size: 14px; display: inline-block; margin-top: 15px; }
        a:hover { color: white; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>☕ Admin Login</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <input type="text" name="username" required placeholder="Username">
            <input type="password" name="password" required placeholder="Password">
            <button type="submit">เข้าสู่ระบบ</button>
        </form>
        
        <a href="{{ url_for('home') }}">← กลับไปหน้าร้าน</a>
    </div>

</body>
</html>
